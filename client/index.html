<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notely - Secure Note Taking</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 20px;
        line-height: 1.5;
        background-color: #fafafa;
        color: #222;
      }
      .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 16px;
        margin-bottom: 16px;
      }
      input, textarea, button, select {
        padding: 8px;
        margin: 4px 0;
        font-family: inherit;
        font-size: 14px;
      }
      button {
        cursor: pointer;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 6px 12px;
      }
      button.danger {
        background: #cc0000;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #eee;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
        background: #eee;
        margin-right: 4px;
      }
      .badge-admin {
        background: #ffeb3b;
      }
      .nav-tabs button {
        background: #eee;
        color: #333;
        margin-right: 6px;
      }
      .nav-tabs button.active {
        background: #0066cc;
        color: #fff;
      }
      .pagination {
        margin: 10px 0;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-content {
        background: #ffffff;
        border-radius: 6px;
        padding: 20px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
